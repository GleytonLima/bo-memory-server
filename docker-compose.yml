# PostgreSQL para desenvolvimento local. Porta 55432 (configurável: BO_DB_PORT) para não colidir
# com outros Postgres da máquina.
#   docker compose up -d
# Keycloak de TESTE para o SSO (realm "bo-memoria", usuários e segredo só de teste — docs/SSO.md):
#   docker compose --profile sso up -d keycloak      → http://localhost:8180
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bo
      POSTGRES_PASSWORD: bo
      POSTGRES_DB: bo_memory
    ports:
      - "127.0.0.1:${BO_DB_PORT:-55432}:5432" # só nesta máquina: a senha é de desenvolvimento
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro # cria também o banco de testes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bo -d bo_memory"]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin # só teste local
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:${BO_KEYCLOAK_PORT:-8180}:8080" # só nesta máquina: admin/admin de teste
    volumes:
      - ./docker/keycloak/realm-bo-memoria.json:/opt/keycloak/data/import/realm-bo-memoria.json:ro

volumes:
  pgdata:
